[project]
name = "my-project"
version = "0.1.0"
description = "A research/analysis project"
requires-python = ">=3.12"
dependencies = []
# 加入專案依賴：uv add numpy scipy pandas

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "basedpyright>=1.0",
    "ruff>=0.1",
    # 選用：nbstripout 可在提交前自動清除 notebook output
    # "nbstripout>=0.7",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "Darwin"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
